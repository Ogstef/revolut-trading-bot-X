spring:
  application:
    name: revolut-trading-bot

  datasource:
    url: jdbc:postgresql://localhost:5432/trading_bot
    username: trading_bot
    password: secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trading
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: trading

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

trading:
  pairs: [BTC-EUR, ETH-EUR, SOL-EUR]  # all active trading pairs; first entry is the primary pair
  intervals: [15, 60, 240, 1440, 10080] # candle intervals in minutes (15m, 1h, 4h, 1d, 1w); first entry is the primary interval
  mode: PAPER
  polling-interval-seconds: 30
  signal-log-retention-days: 14        # nightly cleanup deletes signal_logs rows older than this
  paper-balance: 10000.00              # fallback balance used when a pair/strategy is not listed below
  primary-strategy: EMA_CROSSOVER      # which strategy drives the legacy /api/status metrics
  strategy-balances:                   # nested: pair → strategy → starting EUR balance
    BTC-EUR:
      EMA_CROSSOVER: 10000.00
      MACD: 10000.00
      BOLLINGER: 10000.00
      RSI_MOMENTUM: 10000.00
      STOCH_RSI: 10000.00
      TRIPLE_EMA: 10000.00
      PARABOLIC_SAR: 10000.00
      ADX_DI: 10000.00
      CCI: 10000.00
      MFI: 10000.00
      DONCHIAN: 10000.00
      ICHIMOKU: 10000.00
      MARKET_CONTEXT: 10000.00
    ETH-EUR:
      EMA_CROSSOVER: 5000.00
      MACD: 5000.00
      BOLLINGER: 5000.00
      RSI_MOMENTUM: 5000.00
      STOCH_RSI: 5000.00
      TRIPLE_EMA: 5000.00
      PARABOLIC_SAR: 5000.00
      ADX_DI: 5000.00
      CCI: 5000.00
      MFI: 5000.00
      DONCHIAN: 5000.00
      ICHIMOKU: 5000.00
      MARKET_CONTEXT: 5000.00
    SOL-EUR:
      EMA_CROSSOVER: 5000.00
      MACD: 5000.00
      BOLLINGER: 5000.00
      RSI_MOMENTUM: 5000.00
      STOCH_RSI: 5000.00
      TRIPLE_EMA: 5000.00
      PARABOLIC_SAR: 5000.00
      ADX_DI: 5000.00
      CCI: 5000.00
      MFI: 5000.00
      DONCHIAN: 5000.00
      ICHIMOKU: 5000.00
      MARKET_CONTEXT: 5000.00
  costs:
    fee-rate: 0.0009   # per-side taker fee — Revolut X exchange rate (same for all plans, incl. Ultra Metal)
    slippage-rate: 0.0005  # per-side slippage estimate — 5 bps, reasonable for BTC/ETH market orders at this size
  strategy:
    ema-short-period: 9
    ema-long-period: 21
    rsi-period: 14
    rsi-overbought: 70
    rsi-oversold: 30
  risk:
    max-position-pct: 2.0
    max-concurrent-positions: 3
    max-daily-loss-pct: 10.0
    max-consecutive-losses: 15
    take-profit-pct: 12
    stop-loss-pct: 4

sentiment:
  enabled: true                        # opt-in per environment — flip to true once scraper is deployed + classifier key set
  ingest:
    auth-token: ${SENTIMENT_INGEST_TOKEN:}   # shared secret — scraper presents this as Bearer token; empty = endpoint disabled
    max-batch-size: 200                      # ingest rejects oversized batches with 413
  reddit-filters:                        # applied server-side before a post is sent to the Haiku classifier
    # Tuned 2026-04-26 (after Mac-tunnel proxy enabled JSON-based scraping with real engagement metrics):
    # /new returns very fresh posts — most have score=1, comments=0 because they haven't been
    # voted on yet. min-score≥3 + min-comments≥1 still filters junk while letting fresh-but-
    # engaging posts through. Worth re-tightening if Haiku spend trends high.
    min-score:    3                      # upvotes — real value from Reddit JSON
    min-comments: 1                      # comments — real value from Reddit JSON
    max-age-hours: 72                    # keep generous; /new spans multiple days on slower subs
  classifier:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-4-5-20251001
    batch-size: 20
    monthly-budget-usd: 3.00            # ~€2.80 hard ceiling — strictly under €3/month
    daily-budget-usd: 0.12               # soft-cap; monthly cap always wins
    alert-at-monthly-pct: 80            # one-shot Telegram alert when crossed
  windows:
    # Tuned 2026-04-25 after first observation: real Reddit volume on BTC across the 4 subs is ~1 eligible post/hr,
    # not the 10-50/hr the original draft assumed. Thresholds lowered ~10x so signals can actually fire.
    "15m": { minutes: 60,    reddit-min-sample: 2,  cryptopanic-min-sample: 2,  combined-min-sample: 2  }
    "1h":  { minutes: 240,   reddit-min-sample: 4,  cryptopanic-min-sample: 2,  combined-min-sample: 4  }
    "4h":  { minutes: 960,   reddit-min-sample: 8,  cryptopanic-min-sample: 4,  combined-min-sample: 8  }
    "1d":  { minutes: 4320,  reddit-min-sample: 20, cryptopanic-min-sample: 10, combined-min-sample: 20 }
    "1w":  { minutes: 20160, reddit-min-sample: 50, cryptopanic-min-sample: 25, combined-min-sample: 50 }
  strategies:
    # Tuned 2026-04-25: ±0.20 (was ±0.35) — first-week measurement bar.
    # Tighten back up after we see what sentiment magnitudes actually predict.
    reddit:
      buy-threshold:  0.20
      sell-threshold: -0.20
    cryptopanic:
      buy-threshold:  0.20
      sell-threshold: -0.20
    combined:
      buy-threshold:   0.25             # slightly higher bar for multi-source agreement
      sell-threshold: -0.25
      require-agreement: true           # HOLD if Reddit and CryptoPanic signs diverge

market-context:
  # Standalone MARKET_CONTEXT strategy: contrarian on macro Fear & Greed, confirmed by
  # order-book pressure in the same direction. Both conditions must hold to trade.
  buy-fear-greed-max:    25             # F&G ≤ this → "Extreme Fear" zone
  buy-bid-ask-ratio-min: 1.20           # bids ≥ 1.2× asks at top-5 levels
  sell-fear-greed-min:   75             # F&G ≥ this → "Extreme Greed" zone
  sell-bid-ask-ratio-max: 0.83          # bids ≤ 0.83× asks (≈ ratio < 1/1.2)

revolut:
  api:
    base-url: https://revx.revolut.com/api/1.0
    api-key: ${REVOLUT_API_KEY:}
    private-key-path: ${REVOLUT_PRIVATE_KEY_PATH:}
    rate-limit-per-minute: 1000


server:
  port: 8089

telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
  daily-summary-cron: "0 */30 * * * *"
  send-trade-notifications: true
  send-error-notifications: true
  send-daily-summary: true
  max-messages-per-minute: 20

logging:
  level:
    com.stefo.revolut_trading_bot: INFO          # your code
    com.stefo.revolut_trading_bot.strategy.impl: DEBUG  # per-strategy indicator values (noisy, debug only)
    org.springframework: WARN                    # suppress Spring noise
    org.hibernate: WARN                          # suppress SQL noise