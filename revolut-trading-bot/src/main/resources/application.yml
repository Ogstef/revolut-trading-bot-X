spring:
  application:
    name: revolut-trading-bot

  datasource:
    url: jdbc:postgresql://localhost:5432/trading_bot
    username: trading_bot
    password: secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trading
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: trading

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

trading:
  pairs: [BTC-EUR, ETH-EUR, SOL-EUR]  # all active trading pairs; first entry is the primary pair
  intervals: [15, 60, 240, 1440, 10080] # candle intervals in minutes (15m, 1h, 4h, 1d, 1w); first entry is the primary interval
  mode: PAPER
  polling-interval-seconds: 30
  paper-balance: 10000.00              # fallback balance used when a pair/strategy is not listed below
  primary-strategy: EMA_CROSSOVER      # which strategy drives the legacy /api/status metrics
  strategy-balances:                   # nested: pair → strategy → starting EUR balance
    BTC-EUR:
      EMA_CROSSOVER: 10000.00
      MACD: 10000.00
      BOLLINGER: 10000.00
      RSI_MOMENTUM: 10000.00
      STOCH_RSI: 10000.00
      TRIPLE_EMA: 10000.00
      PARABOLIC_SAR: 10000.00
      ADX_DI: 10000.00
      CCI: 10000.00
      MFI: 10000.00
      DONCHIAN: 10000.00
      ICHIMOKU: 10000.00
    ETH-EUR:
      EMA_CROSSOVER: 5000.00
      MACD: 5000.00
      BOLLINGER: 5000.00
      RSI_MOMENTUM: 5000.00
      STOCH_RSI: 5000.00
      TRIPLE_EMA: 5000.00
      PARABOLIC_SAR: 5000.00
      ADX_DI: 5000.00
      CCI: 5000.00
      MFI: 5000.00
      DONCHIAN: 5000.00
      ICHIMOKU: 5000.00
    SOL-EUR:
      EMA_CROSSOVER: 5000.00
      MACD: 5000.00
      BOLLINGER: 5000.00
      RSI_MOMENTUM: 5000.00
      STOCH_RSI: 5000.00
      TRIPLE_EMA: 5000.00
      PARABOLIC_SAR: 5000.00
      ADX_DI: 5000.00
      CCI: 5000.00
      MFI: 5000.00
      DONCHIAN: 5000.00
      ICHIMOKU: 5000.00
  costs:
    fee-rate: 0.0009   # per-side taker fee — Revolut X exchange rate (same for all plans, incl. Ultra Metal)
    slippage-rate: 0.0005  # per-side slippage estimate — 5 bps, reasonable for BTC/ETH market orders at this size
  strategy:
    ema-short-period: 9
    ema-long-period: 21
    rsi-period: 14
    rsi-overbought: 70
    rsi-oversold: 30
  risk:
    max-position-pct: 2.0
    max-concurrent-positions: 3
    max-daily-loss-pct: 10.0
    max-consecutive-losses: 15
    take-profit-pct: 12
    stop-loss-pct: 4
  leverage:
    enabled: true                    # Phase 3 fan-out landed — leveraged portfolios active
    ratios: [3, 5, 10]               # LEV_3X, LEV_5X, LEV_10X
    pairs: [BTC-EUR]                 # subset of trading.pairs
    intervals: [60, 240, 1440]       # subset of trading.intervals (1h, 4h, 1d)
    collateral-per-strategy: 1000.00 # EUR per (pair, strategy, ratio) — isolated from spot
    maintenance-margin-pct: 0.5      # % notional at which liquidation triggers
    funding-rate-per-8h: 0.0001      # 0.01% of notional per 8h (flat model)
    max-concurrent-positions: 2      # tighter than spot's 3
    max-position-pct: 100            # 100% of collateral per trade (leverage is the multiplier)
    allow-shorts: true
    excluded-strategies: [PARABOLIC_SAR, MACD]  # fee-victim strategies — block new leveraged opens, SPOT unaffected
    cooldown-minutes: 30             # block re-opens on same (pair, interval, strategy, vehicle) after a close

revolut:
  api:
    base-url: https://revx.revolut.com/api/1.0
    api-key: ${REVOLUT_API_KEY:}
    private-key-path: ${REVOLUT_PRIVATE_KEY_PATH:}
    rate-limit-per-minute: 1000


server:
  port: 8089

telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
  daily-summary-cron: "0 */30 * * * *"
  send-trade-notifications: true
  send-error-notifications: true
  send-daily-summary: true
  max-messages-per-minute: 20

logging:
  level:
    com.stefo.revolut_trading_bot: INFO          # your code
    com.stefo.revolut_trading_bot.strategy.impl: DEBUG  # per-strategy indicator values (noisy, debug only)
    org.springframework: WARN                    # suppress Spring noise
    org.hibernate: WARN                          # suppress SQL noise